; Creating a howler holds a worker while the voice is made (seconds), so there must be enough workers that a few slow
; creations never starve the cheap requests (state, open). The per-IP rate limits cap how many can be slow at once.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 90s
; the workers' stderr goes to the container log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
