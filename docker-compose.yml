# Local development: PostgreSQL and the Laravel API, both in containers (the same shape that runs on the server, ADR-004).
#
#   docker compose up -d db            start the database
#   docker compose run --rm backend php artisan migrate:fresh --seed
#   docker compose run --rm backend php artisan test
#   docker compose up backend          the API at http://localhost:8000
#
# On Windows, Docker runs inside WSL (see backend/README.md). The credentials below are for local development only.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: howler
      POSTGRES_USER: howler
      POSTGRES_PASSWORD: howler
    ports:
      - "127.0.0.1:5432:5432" # only this computer can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro # creates the howler_test database on the first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U howler -d howler"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: docker
      dockerfile: php.Dockerfile
    image: howler-php
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - path: .env.local # holds OPENAI_API_KEY; git-ignored, optional
        required: false
    environment:
      DB_HOST: db
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # PHP's own server, not `artisan serve`: artisan only forwards a short list of environment variables to its child, so
    # OPENAI_API_KEY (from .env.local, above) would never arrive. Several workers, because creating a howler waits on the
    # voice for a few seconds and must not block everyone else.
    command: sh -c "cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

volumes:
  pgdata:
