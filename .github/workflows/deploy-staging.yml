name: Deploy staging

# Builds the two images from the commit, publishes them to GitHub's container registry and updates the staging VM over
# SSH with deploy/deploy.sh (which rolls back by itself if the new version is not healthy).
#
# It does nothing until the owner turns it on: set the repository VARIABLE STAGING_ENABLED to "true" and add the
# variables and secrets listed in docs/DEPLOYMENT.md. Until then every run is skipped, so a push to main never fails
# just because there is no server yet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy an image tag that already exists (a rollback to a known version). Empty builds the current commit.'
        required: false
        default: ''

# one deploy at a time; a second one waits for the first instead of cancelling it half way
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy to staging
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.tag.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the app image
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.prod.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/howler-app:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and publish the web image
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          # public, build-time values for the page: never secrets
          build-args: |
            VITE_SITE_URL=https://${{ vars.STAGING_DOMAIN }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
            VITE_RELEASE=${{ steps.tag.outputs.value }}
          tags: ${{ env.REGISTRY }}/howler-web:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # the server's host key is pinned: the deploy refuses to talk to anything else
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_TARGET: ${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_SSH_HOST }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # the compose file and the scripts travel with the commit, so they always match the images
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml deploy/deploy.sh deploy/rollback.sh deploy/backup.sh "$SSH_TARGET:/opt/howler/"
          # the registry token goes in through stdin (never on the command line) and is forgotten right after the deploy
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "$SSH_TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && cd /opt/howler && chmod +x *.sh && REGISTRY='${REGISTRY}' ./deploy.sh '${TAG}'; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

      - name: Check the site from outside
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -m 10 "https://${DOMAIN}/up" >/dev/null; then echo "https://${DOMAIN}/up is answering"; exit 0; fi
            sleep 6
          done
          echo "the site did not answer from outside" >&2
          exit 1
