; Creating a howler holds a worker while the voice is made (seconds), so there must be enough workers that a few slow
; creations never starve the cheap requests (state, open). The per-IP rate limits cap how many can be slow at once.
;
; Sized for the staging VM (e2-micro: 1 GB of memory shared with PostgreSQL, Caddy and the scheduler). A worker uses about
; 30 to 60 MB, so 8 of them is the most this machine can hold without swapping hard. On a bigger VM raise max_children
; (about 20 for 4 GB) and mention it in docs/DEPLOYMENT.md.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 90s
; the workers' stderr goes to the container log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
