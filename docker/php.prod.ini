; Production PHP settings for the Howler API.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; The code never changes inside a running container, so never re-check files.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Requests are tiny JSON (140 characters). Creating a howler waits on the voice model for up to two attempts of 30 seconds.
post_max_size = 16K
upload_max_filesize = 1K
max_execution_time = 90
memory_limit = 128M
